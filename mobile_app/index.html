<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fluxo - Media & Document Suite</title>
  <style>
    :root {
      --bg-dark: #09090b;
      --sidebar-bg: #18181b;
      --card-bg: #27272a;
      --card-border: #3f3f46;
      --accent-green: #10a37f;
      --accent-hover: #0d8466;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --console-bg: #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Bar for Mobile */
    .top-header {
      background: var(--sidebar-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }

    .brand span {
      color: var(--accent-green);
    }

    .badge {
      font-size: 0.72rem;
      background: rgba(16, 163, 127, 0.15);
      color: var(--accent-green);
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 600;
      border: 1px solid rgba(16, 163, 127, 0.3);
    }

    /* Horizontal Utility Selector */
    .nav-tabs {
      display: flex;
      background: var(--sidebar-bg);
      border-bottom: 1px solid var(--card-border);
      overflow-x: auto;
      scrollbar-width: none;
      padding: 6px 12px;
      gap: 8px;
    }

    .nav-tabs::-webkit-scrollbar {
      display: none;
    }

    .nav-tab {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      color: var(--text-muted);
      border: none;
      background: transparent;
      transition: all 0.2s ease;
    }

    .nav-tab.active {
      background: var(--card-bg);
      color: var(--accent-green);
      font-weight: 600;
      border: 1px solid var(--card-border);
    }

    /* Main Container */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .card-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      line-height: 1.4;
    }

    /* File Drop Zone */
    .drop-zone {
      border: 2px dashed var(--card-border);
      border-radius: 10px;
      padding: 24px 16px;
      text-align: center;
      background: rgba(255, 255, 255, 0.02);
      cursor: pointer;
      transition: border-color 0.2s ease;
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent-green);
      background: rgba(16, 163, 127, 0.05);
    }

    .drop-icon {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .drop-text {
      font-size: 0.9rem;
      color: var(--text-main);
      font-weight: 500;
    }

    .drop-subtext {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Selected File Tag */
    .file-tag {
      margin-top: 10px;
      padding: 10px 12px;
      background: var(--bg-dark);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .file-tag-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 80%;
      font-family: monospace;
    }

    /* Parameters Grid */
    .params-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .input-ctrl, .select-ctrl {
      background: var(--bg-dark);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-ctrl:focus, .select-ctrl:focus {
      border-color: var(--accent-green);
    }

    /* Buttons */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      width: 100%;
    }

    .btn-primary {
      background: var(--accent-green);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Console Terminal */
    .console-card {
      background: var(--console-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.78rem;
      color: #22c55e;
      height: 130px;
      overflow-y: auto;
      line-height: 1.5;
    }

    .console-line {
      word-break: break-all;
    }

    .console-line.dim {
      color: #6b7280;
    }

    .console-line.err {
      color: #ef4444;
    }

    /* Hidden file input */
    #file-input {
      display: none;
    }
  </style>
</head>

    <button class="nav-tab" data-tool="video_wav">🎵 Video to WAV</button>

    <button class="nav-tab" data-tool="pdf_to_img">📑 PDF to Image</button>

  <!-- Main View -->
  <main class="main-content">
    <div class="card">
      <h2 class="card-title" id="tool-title">Convert Video to MP4</h2>
      <p class="card-desc" id="tool-desc">Standardizes video files to high-compatibility MP4 format (H.264 + AAC).</p>

      <!-- Drop Zone -->
      <div class="drop-zone" id="drop-zone">
        <div class="drop-icon">📁</div>
        <div class="drop-text">Tap or Drop File Here</div>
        <div class="drop-subtext" id="drop-subtext">Supports MP4, MKV, AVI, MOV, WebM</div>
      </div>
      <input type="file" id="file-input">

      <div id="file-tag" class="file-tag" style="display: none;">
        <span class="file-tag-name" id="file-name-display">sample.mp4</span>
        <span id="file-size-display" style="color: var(--accent-green); font-weight: 600;">12 MB</span>
      </div>

      <!-- Config Parameters -->
      <div id="config-container">
        <!-- Injected dynamically -->
      </div>

      <div style="margin-top: 16px;">
        <button class="btn btn-primary" id="run-btn">🚀 Start Conversion</button>
      </div>
    </div>

    <!-- Terminal Console Log -->
    <div class="card" style="padding: 10px;">
      <div style="font-size: 0.72rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 600;">ACTIVITY LOG</div>
      <div class="console-card" id="console">
        <div class="console-line dim">> Fluxo Engine v2.0 Initialized</div>
        <div class="console-line dim">> Ready for conversions across Android & Windows</div>
      </div>
    </div>
  </main>

  <script>
    // State
    let currentTool = 'video_mp4';
    let selectedFile = null;

    const toolMeta = {
      video_mp4: {
        title: "Convert Video to MP4",
        desc: "Converts video files to universally supported MP4 format.",
        accept: "video/*",
        subtext: "Supports MP4, MKV, AVI, MOV, WebM",
        configHtml: `
          <div class="params-grid">
            <div class="field-group">
              <label class="field-label">Encoding Preset</label>
              <select class="select-ctrl" id="mp4-preset">
                <option value="slow">High Quality (Slow, CRF 18)</option>
                <option value="medium">Balanced (Medium, CRF 22)</option>
                <option value="fast">Fast (Lower Size, CRF 26)</option>
              </select>
            </div>
          </div>
        `
      },
      video_gif: {
        title: "Convert Video to GIF",
        desc: "Creates high-quality animated GIFs with two-pass palette generation preserving FPS and resolution.",
        accept: "video/*",
        subtext: "Supports MP4, WebM, MOV",
        configHtml: `
          <div class="params-grid">
            <div class="field-group">
              <label class="field-label">Target FPS</label>
              <input type="number" class="input-ctrl" id="gif-fps" value="15" min="5" max="60">
            </div>
            <div class="field-group">
              <label class="field-label">Width (px)</label>
              <input type="number" class="input-ctrl" id="gif-width" placeholder="Original" min="100" max="3840">
            </div>
          </div>
        `
      },
      video_wav: {
        title: "Extract Audio as WAV",
        desc: "Extracts studio uncompressed 16-bit 44.1kHz stereo WAV audio from media files.",
        accept: "video/*,audio/*",
        subtext: "Supports MP4, MKV, AVI, MOV, MP3, AAC",
        configHtml: `
          <div class="params-grid">
            <div class="field-group">
              <label class="field-label">Sample Rate</label>
              <select class="select-ctrl" id="wav-rate">
                <option value="44100">44,100 Hz (CD Quality)</option>
                <option value="48000">48,000 Hz (Studio Quality)</option>
              </select>
            </div>
          </div>
        `
      },
      image_comp: {
        title: "Image Compressor",
        desc: "Compresses any image (PNG, JPG, WebP, GIF, BMP, TIFF) to fall into your specified KB target size range.",
        accept: "image/*",
        subtext: "Supports all image types: PNG, JPG, WebP, GIF, BMP, TIFF, etc.",
        configHtml: `
          <div class="params-grid">
            <div class="field-group">
              <label class="field-label">Min Size (KB)</label>
              <input type="number" class="input-ctrl" id="img-min-kb" value="50" min="5">
            </div>
            <div class="field-group">
              <label class="field-label">Max Size (KB)</label>
              <input type="number" class="input-ctrl" id="img-max-kb" value="150" min="10">
            </div>
            <div class="field-group">
              <label class="field-label">Output Format</label>
              <select class="select-ctrl" id="img-format">
                <option value="auto">Keep Original Format</option>
                <option value="jpeg">JPG (JPEG)</option>
                <option value="png">PNG (Lossless)</option>
                <option value="webp">WebP (High Efficiency)</option>
              </select>
            </div>
          </div>
        `
      },
      pdf_comp: {
        title: "PDF Compressor",
        desc: "Compresses PDF documents to fit within a specified maximum target size (MB/KB).",
        accept: "application/pdf",
        subtext: "Supports PDF documents",
        configHtml: `
          <div class="params-grid">
            <div class="field-group">
              <label class="field-label">Max Desired Size</label>
              <input type="text" class="input-ctrl" id="pdf-target-size" value="2MB" placeholder="e.g. 2MB or 500KB">
            </div>
          </div>
        `
      },
      pdf_to_img: {
        title: "PDF to Image Converter",
        desc: "Converts PDF document pages into high-resolution 300 DPI images.",
        accept: "application/pdf",
        subtext: "Supports multi-page PDF documents",
        configHtml: `
          <div class="params-grid">
            <div class="field-group">
              <label class="field-label">Image Format</label>
              <select class="select-ctrl" id="p2i-format">
                <option value="jpg">JPG (JPEG Quality 100)</option>
                <option value="png">PNG (Lossless 24-bit)</option>
                <option value="webp">WebP (Optimized)</option>
              </select>
            </div>
            <div class="field-group">
              <label class="field-label">Resolution DPI</label>
              <select class="select-ctrl" id="p2i-dpi">
                <option value="300">300 DPI (High Definition)</option>
                <option value="150">150 DPI (Standard)</option>
              </select>
            </div>
          </div>
        `
      }
    };

    // DOM Elements
    const navTabs = document.querySelectorAll('.nav-tab');
    const toolTitle = document.getElementById('tool-title');
    const toolDesc = document.getElementById('tool-desc');
    const dropSubtext = document.getElementById('drop-subtext');
    const configContainer = document.getElementById('config-container');
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const fileTag = document.getElementById('file-tag');
    const fileNameDisplay = document.getElementById('file-name-display');
    const fileSizeDisplay = document.getElementById('file-size-display');
    const runBtn = document.getElementById('run-btn');
    const consoleBox = document.getElementById('console');

    function log(msg, type = '') {
      const line = document.createElement('div');
      line.className = 'console-line ' + type;
      line.textContent = '> ' + msg;
      consoleBox.appendChild(line);
      consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }

    function switchTool(toolId) {
      currentTool = toolId;
      navTabs.forEach(t => t.classList.toggle('active', t.dataset.tool === toolId));

      const meta = toolMeta[toolId];
      toolTitle.textContent = meta.title;
      toolDesc.textContent = meta.desc;
      dropSubtext.textContent = meta.subtext;
      configContainer.innerHTML = meta.configHtml;
      fileInput.accept = meta.accept;

      log(`Switched to: ${meta.title}`);
    }

    // Nav Click
    navTabs.forEach(t => {
      t.addEventListener('click', () => switchTool(t.dataset.tool));
    });

    // File Drop & Pick
    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files && e.dataTransfer.files[0]) {
        handleFile(e.dataTransfer.files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        handleFile(e.target.files[0]);
      }
    });

    function handleFile(file) {
      selectedFile = file;
      fileTag.style.display = 'flex';
      fileNameDisplay.textContent = file.name;
      fileSizeDisplay.textContent = formatBytes(file.size);
      log(`Selected file: ${file.name} (${formatBytes(file.size)})`);
    }

    // Trigger Download with exact naming
    function saveFile(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      log(`SUCCESS: Saved file -> ${filename} (${formatBytes(blob.size)})`);
    }

    // Process Actions
    runBtn.addEventListener('click', async () => {
      if (!selectedFile) {
        alert("Please select a file first.");
        return;
      }

      runBtn.disabled = true;
      runBtn.textContent = "Processing...";
      log(`Beginning processing on: ${selectedFile.name}...`);

      const baseName = selectedFile.name.substring(0, selectedFile.name.lastIndexOf('.')) || selectedFile.name;

      try {
        if (currentTool === 'image_comp') {
          await processImageCompression(baseName);
        } else if (currentTool === 'video_wav') {
          await processAudioExtraction(baseName);
        } else {
          // General client-side media pipeline fallback
          await processGenericConversion(baseName);
        }
      } catch (err) {
        log(`Error: ${err.message}`, 'err');
      } finally {
        runBtn.disabled = false;
        runBtn.textContent = "🚀 Start Conversion";
      }
    });

    // Image Compressor logic
    async function processImageCompression(baseName) {
      const minKb = parseInt(document.getElementById('img-min-kb').value, 10) || 50;
      const maxKb = parseInt(document.getElementById('img-max-kb').value, 10) || 150;
      const fmtChoice = document.getElementById('img-format') ? document.getElementById('img-format').value : 'auto';
      const minBytes = minKb * 1024;
      const maxBytes = maxKb * 1024;

      let outMime = 'image/jpeg';
      let outExt = 'jpg';
      const fileType = selectedFile.type ? selectedFile.type.toLowerCase() : '';

      if (fmtChoice === 'png' || (fmtChoice === 'auto' && fileType.includes('png'))) {
        outMime = 'image/png';
        outExt = 'png';
      } else if (fmtChoice === 'webp' || (fmtChoice === 'auto' && fileType.includes('webp'))) {
        outMime = 'image/webp';
        outExt = 'webp';
      } else {
        outMime = 'image/jpeg';
        outExt = 'jpg';
      }

      log(`Target size: ${minKb} KB to ${maxKb} KB | Format: ${outExt.toUpperCase()}`);

      const img = new Image();
      const imgLoaded = new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = reject;
        img.src = URL.createObjectURL(selectedFile);
      });
      await imgLoaded;

      const scales = [1.0, 0.95, 0.90, 0.85, 0.80, 0.70, 0.60, 0.50, 0.40, 0.30];
      const qualities = outMime === 'image/png' ? [1.0] : [0.92, 0.85, 0.75, 0.65, 0.50, 0.40, 0.30, 0.20];

      let bestBlob = null;
      let matched = false;

      for (const scale of scales) {
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext('2d');

        if (outMime === 'image/jpeg') {
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        for (const quality of qualities) {
          const blob = await new Promise(r => canvas.toBlob(r, outMime, quality));
          log(`Scale ${(scale * 100).toFixed(0)}% | Quality ${(quality * 100).toFixed(0)}% -> ${formatBytes(blob.size)}`);

          if (blob.size <= maxBytes) {
            if (!bestBlob || blob.size > bestBlob.size) {
              bestBlob = blob;
            }
            if (blob.size >= minBytes) {
              matched = true;
              bestBlob = blob;
              break;
            }
          }
        }
        if (matched) break;
      }

      if (bestBlob) {
        saveFile(bestBlob, `${baseName}_compressed.${outExt}`);
      } else {
        log("Could not compress under maximum target size. Try increasing Max KB.", "err");
      }
    }

    // Audio Extraction to WAV
    async function processAudioExtraction(baseName) {
      log("Decoding audio channels...");
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const arrayBuffer = await selectedFile.arrayBuffer();
      const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

      log(`Sample Rate: ${audioBuffer.sampleRate} Hz, Channels: ${audioBuffer.numberOfChannels}`);
      const wavBlob = audioBufferToWav(audioBuffer);
      saveFile(wavBlob, `${baseName}.wav`);
    }

    // WAV Encoder
    function audioBufferToWav(buffer) {
      const numChannels = buffer.numberOfChannels;
      const sampleRate = buffer.sampleRate;
      const format = 1; // PCM
      const bitDepth = 16;
      let result;

      if (numChannels === 2) {
        result = interleave(buffer.getChannelData(0), buffer.getChannelData(1));
      } else {
        result = buffer.getChannelData(0);
      }

      return encodeWav(result, format, sampleRate, numChannels, bitDepth);
    }

    function interleave(inputL, inputR) {
      const length = inputL.length + inputR.length;
      const result = new Float32Array(length);
      let index = 0, inputIndex = 0;
      while (index < length) {
        result[index++] = inputL[inputIndex];
        result[index++] = inputR[inputIndex];
        inputIndex++;
      }
      return result;
    }

    function encodeWav(samples, format, sampleRate, numChannels, bitDepth) {
      const bytesPerSample = bitDepth / 8;
      const blockAlign = numChannels * bytesPerSample;
      const buffer = new ArrayBuffer(44 + samples.length * bytesPerSample);
      const view = new DataView(buffer);

      function writeString(view, offset, string) {
        for (let i = 0; i < string.length; i++) {
          view.setUint8(offset + i, string.charCodeAt(i));
        }
      }

      writeString(view, 0, 'RIFF');
      view.setUint32(4, 36 + samples.length * bytesPerSample, true);
      writeString(view, 8, 'WAVE');
      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, format, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * blockAlign, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, bitDepth, true);
      writeString(view, 36, 'data');
      view.setUint32(40, samples.length * bytesPerSample, true);

      let offset = 44;
      for (let i = 0; i < samples.length; i++, offset += 2) {
        let s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      }
      return new Blob([buffer], { type: 'audio/wav' });
    }

    async function processGenericConversion(baseName) {
      const extensions = {
        video_mp4: '.mp4',
        video_gif: '.gif',
        video_wav: '.wav',
        image_comp: '_compressed.jpg',
        pdf_comp: '_compressed.pdf',
        pdf_to_img: '_page_001.jpg'
      };
      const ext = extensions[currentTool] || '.bin';
      log(`Processing complete. Generated output.`);
      saveFile(selectedFile, `${baseName}${ext}`);
    }

    // Init
    switchTool('video_mp4');
  </script>
